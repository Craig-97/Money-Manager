}

input RecurringPaymentInput {
  name: String!
  amount: Float!
  category: RecurringPaymentCategory!
  frequency: PaymentFrequency!
  type: PaymentType!
  firstPaymentDate: String!
  lastPaymentDate: String
  renewalDate: String
  dueReminder: ReminderTimingInput
