  type: PaymentType!
  category: OneOffPaymentCategory!
  dueReminder: ReminderTimingInput
}

input UpdateOneOffPaymentInput {
  name: String
  amount: Float
  dueDate: String
  type: PaymentType
  category: OneOffPaymentCategory
