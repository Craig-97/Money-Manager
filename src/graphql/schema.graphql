  HOME_MAINTENANCE
  TAX
  VEHICLE
  TRANSPORT
  LOAN
  CREDIT_CARD
  SAVINGS
  INVESTMENT
  INSURANCE
  HEALTHCARE
  CHILDCARE
  EDUCATION
  SUBSCRIPTION
  MEMBERSHIP
  FOOD
  CHARITY
  BUSINESS
  OTHER
}

enum PaymentFrequency {
  WEEKLY
  BIWEEKLY
  MONTHLY
  QUARTERLY
  BIANNUALLY
  ANNUALLY
}

enum PaymentRecordKind {
  PAID
  SKIPPED
  OVERPAYMENT
  BALANCE_SET
}

type RecurringPayment {
  id: ID!
  budget: ID!
  name: String!
  amount: Float!
  category: RecurringPaymentCategory!
  frequency: PaymentFrequency!
  type: PaymentType!
  firstPaymentDate: String!
  lastPaymentDate: String
  nextDueDate: String
  thisCycle: [PaymentRecord!]!
  history(limit: Int): [PaymentRecord!]!
  renewalDate: String
  dueReminder: ReminderTiming!
  renewalReminder: ReminderTiming!
  debt: Debt
}

type Debt {
  balance: Float!
  startingBalance: Float
  apr: Float!
  balanceUpdatedAt: String
  paidOffThisCycle: Float!
}

input DebtInput {
  balance: Float!
  startingBalance: Float
  apr: Float!
}

type PaymentRecord {
  id: ID!
  kind: PaymentRecordKind!
  dates: [String!]!
  balanceChange: Float!
  debt: PaymentRecordDebt
  open: Boolean!
  createdAt: String!
}

type PaymentRecordDebt {
  interest: Float!
  reduction: Float!
  balanceAfter: Float!
}

