type SuccessResponse {
  success: Boolean!
}

type DeleteResponse {
  success: Boolean!
  deletedCount: Int!
  ids: [ID!]!
}

enum ThemePreference {
  DARK
  LIGHT
  SYSTEM
}

type Query {
  tokenFindUser: User
  passwordResetTokenValid(token: String!): PasswordResetTokenCheck!
  account(id: ID): Account
}

type User {
  id: ID!
  account: ID
  email: String!
  firstName: String!
  surname: String!
  theme: ThemePreference
  accent: String
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  surname: String!
}

input UserDetailsInput {
  firstName: String!
  surname: String!
  email: String!
}

type UserResponse {
  user: User
  account: ID
  success: Boolean!
}

type AuthData {
  user: User!
  token: String!
  tokenExpiration: Int!
}

type PasswordResetTokenCheck {
  valid: Boolean!
  email: String
}

type Mutation {
  login(email: String!, password: String!): AuthData!
  refreshSession: AuthData!
  logout: SuccessResponse!
  logoutEverywhere: SuccessResponse!
  registerAndLogin(input: RegisterInput!): AuthData!
  requestPasswordReset(email: String!): SuccessResponse!
  resetPassword(token: String!, password: String!): AuthData!
  updateCurrentUser(input: UserDetailsInput!): UserResponse!
  changePassword(currentPassword: String!, newPassword: String!): UserResponse!
  deleteCurrentUser: UserResponse!
  updatePreferences(theme: ThemePreference, accent: String): UserResponse!
  createAccount(input: CreateAccountInput!): AccountResponse!
  updateAccount(id: ID!, input: UpdateAccountInput!): AccountResponse!
  startPaydayCycle(input: StartPaydayCycleInput!): AccountResponse!
  markPaymentsPaid(input: MarkPaymentsPaidInput!): AccountResponse!
  markPaymentsUnpaid(input: MarkPaymentsUnpaidInput!): AccountResponse!
  skipRecurringPayments(input: SkipRecurringPaymentsInput!): AccountResponse!
  createOneOffPayment(input: CreateOneOffPaymentInput!): OneOffPaymentResponse!
  updateOneOffPayment(id: ID!, input: UpdateOneOffPaymentInput!): OneOffPaymentResponse!
  batchDeleteOneOffPayments(ids: [ID!]!): DeleteResponse!
  createRecurringPayment(input: CreateRecurringPaymentInput!): RecurringPaymentResponse!
  updateRecurringPayment(id: ID!, input: UpdateRecurringPaymentInput!): RecurringPaymentResponse!
  batchDeleteRecurringPayments(ids: [ID!]!): DeleteResponse!
  createNote(input: CreateNoteInput!): NoteResponse!
  updateNote(id: ID!, input: UpdateNoteInput!): NoteResponse!
  deleteNote(id: ID!): DeleteResponse!
  updatePayday(id: ID!, input: PaydayInput!): PaydayResponse!
  setPaydayOverride(id: ID!, for: String!, date: String): PaydayResponse!
}

type Account {
  id: ID!
  user: User
  bankBalance: Float!
  monthlyIncome: Float!
  oneOffPayments: [OneOffPayment]
  recurringPayments: [RecurringPayment]
  notes: [Note]
  payday: Payday
  cycleStartedOn: String
}

input CreateAccountInput {
  bankBalance: Float!
  monthlyIncome: Float!
  oneOffPayments: [OneOffPaymentInput!]
  recurringPayments: [RecurringPaymentInput!]
  payday: PaydayInput
}

input UpdateAccountInput {
  bankBalance: Float
  monthlyIncome: Float
}

input MarkPaymentsPaidInput {
  accountId: ID!
  recurringPaymentIds: [ID!]!
  oneOffPaymentIds: [ID!]!
}

input MarkPaymentsUnpaidInput {
  accountId: ID!
  recurringPaymentIds: [ID!]!
}

input SkipRecurringPaymentsInput {
  accountId: ID!
  recurringPaymentIds: [ID!]!
}

input StartPaydayCycleInput {
  accountId: ID!
  payday: String!
  bankBalance: Float!
  recurringPaymentIds: [ID!]!
}

type AccountResponse {
  account: Account
  success: Boolean!
}

enum PaymentType {
  INCOME
  EXPENSE
}

enum OneOffPaymentCategory {
  TRANSFER
  INVESTMENT
  FEES
  TAXES
  HOME
  UTILITIES
  VEHICLE
  TRAVEL
  TRANSPORT
  FOOD
  SHOPPING
  ENTERTAINMENT
  HEALTHCARE
  EDUCATION
  GIFT
  PETS
  SALARY
  BUSINESS
  CHARITY
  OTHER
}

type OneOffPayment {
  id: ID!
  account: ID!
  name: String!
  amount: Float!
  dueDate: String!
  type: PaymentType!
  category: OneOffPaymentCategory!
}

input CreateOneOffPaymentInput {
  accountId: ID!
  name: String!
  amount: Float!
  dueDate: String!
  type: PaymentType!
  category: OneOffPaymentCategory!
}

input OneOffPaymentInput {
  name: String!
  amount: Float!
  dueDate: String!
  type: PaymentType!
  category: OneOffPaymentCategory!
}

input UpdateOneOffPaymentInput {
  name: String
  amount: Float
  dueDate: String
  type: PaymentType
  category: OneOffPaymentCategory
}

type OneOffPaymentResponse {
  oneOffPayment: OneOffPayment
  success: Boolean!
}

enum RecurringPaymentCategory {
  MORTGAGE
  RENT
  UTILITIES
  HOME_MAINTENANCE
  TAX
  VEHICLE
  TRANSPORT
  LOAN
  CREDIT_CARD
  SAVINGS
  INVESTMENT
  INSURANCE
  HEALTHCARE
  CHILDCARE
  EDUCATION
  SUBSCRIPTION
  MEMBERSHIP
  FOOD
  CHARITY
  BUSINESS
  OTHER
}

enum PaymentFrequency {
  WEEKLY
  BIWEEKLY
  MONTHLY
  QUARTERLY
  ANNUALLY
}

enum PaymentStatus {
  UNPAID
  PAID
  SKIPPED
}

type RecurringPayment {
  id: ID!
  account: ID!
  name: String!
  amount: Float!
  category: RecurringPaymentCategory!
  frequency: PaymentFrequency!
  type: PaymentType!
  firstPaymentDate: String!
  lastPaymentDate: String
  nextDueDate: String
  status: PaymentStatus!
}

input CreateRecurringPaymentInput {
  accountId: ID!
  name: String!
  amount: Float!
  category: RecurringPaymentCategory!
  frequency: PaymentFrequency!
  type: PaymentType!
  firstPaymentDate: String!
  lastPaymentDate: String
}

input RecurringPaymentInput {
  name: String!
  amount: Float!
  category: RecurringPaymentCategory!
  frequency: PaymentFrequency!
  type: PaymentType!
  firstPaymentDate: String!
  lastPaymentDate: String
}

input UpdateRecurringPaymentInput {
  name: String
  amount: Float
  category: RecurringPaymentCategory
  frequency: PaymentFrequency
  type: PaymentType
  firstPaymentDate: String
  lastPaymentDate: String
}

type RecurringPaymentResponse {
  recurringPayment: RecurringPayment
  success: Boolean!
}

enum NoteColor {
  BLUE
  GREEN
  AMBER
  ROSE
  VIOLET
}

type Note {
  id: ID!
  account: ID!
  body: String!
  color: NoteColor!
  createdAt: String!
  updatedAt: String!
}

input CreateNoteInput {
  accountId: ID!
  body: String!
  color: NoteColor
}

input UpdateNoteInput {
  body: String
  color: NoteColor
}

type NoteResponse {
  note: Note
  success: Boolean!
}

enum PayFrequency {
  WEEKLY
  FORTNIGHTLY
  FOUR_WEEKLY
  MONTHLY
  QUARTERLY
  BIANNUAL
  ANNUAL
}

enum PaydayType {
  LAST_DAY
  LAST_WEEKDAY
  SET_DAY
  SET_WEEKDAY
}

enum Weekday {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
}

enum BankHolidayRegion {
  ENGLAND_AND_WALES
  SCOTLAND
  NORTHERN_IRELAND
}

type PaydayOverride {
  for: String!
  date: String!
}

type Payday {
  id: ID!
  account: ID!
  frequency: PayFrequency!
  type: PaydayType!
  dayOfMonth: Int
  weekday: Weekday
  firstPayDate: String
  bankHolidayRegion: BankHolidayRegion
  overrides: [PaydayOverride!]!
}

input PaydayInput {
  frequency: PayFrequency!
  type: PaydayType!
  dayOfMonth: Int
  weekday: Weekday
  firstPayDate: String
  bankHolidayRegion: BankHolidayRegion
}

type PaydayResponse {
  payday: Payday
  success: Boolean!
}
