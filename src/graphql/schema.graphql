type SuccessResponse {
  success: Boolean!
}

type DeleteResponse {
  success: Boolean!
  deletedCount: Int!
  ids: [ID!]!
}

enum ThemePreference {
  DARK
  LIGHT
  SYSTEM
}

type Query {
  tokenFindUser: User
  passwordResetTokenValid(token: String!): PasswordResetTokenCheck!
  budget(id: ID): Budget
  recurringPayment(id: ID!): RecurringPayment
}

type User {
  id: ID!
  budget: ID
  email: String!
  firstName: String!
  surname: String!
  theme: ThemePreference
  accent: String
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  surname: String!
}

input UserDetailsInput {
  firstName: String!
  surname: String!
  email: String!
}

type UserResponse {
  user: User
  budget: ID
  success: Boolean!
}

type AuthData {
  user: User!
  token: String!
  tokenExpiration: Int!
}

type PasswordResetTokenCheck {
  valid: Boolean!
  email: String
}

type Mutation {
  login(email: String!, password: String!): AuthData!
  refreshSession: AuthData!
  logout: SuccessResponse!
  logoutEverywhere: SuccessResponse!
  registerAndLogin(input: RegisterInput!): AuthData!
  requestPasswordReset(email: String!): SuccessResponse!
  resetPassword(token: String!, password: String!): AuthData!
  updateCurrentUser(input: UserDetailsInput!): UserResponse!
  changePassword(currentPassword: String!, newPassword: String!): UserResponse!
  deleteCurrentUser: UserResponse!
  updatePreferences(theme: ThemePreference, accent: String): UserResponse!
  createBudget(input: CreateBudgetInput!): BudgetResponse!
  updateBudget(id: ID!, input: UpdateBudgetInput!): BudgetResponse!
  startPaydayCycle(input: StartPaydayCycleInput!): BudgetResponse!
  markPaymentsPaid(input: MarkPaymentsPaidInput!): BudgetResponse!
  markPaymentsUnpaid(input: MarkPaymentsUnpaidInput!): BudgetResponse!
  skipRecurringPayments(input: SkipRecurringPaymentsInput!): BudgetResponse!
  logDebtOverpayment(input: LogDebtOverpaymentInput!): BudgetResponse!
  undoDebtOverpayment(input: UndoDebtOverpaymentInput!): BudgetResponse!
  createOneOffPayment(input: CreateOneOffPaymentInput!): OneOffPaymentResponse!
  updateOneOffPayment(id: ID!, input: UpdateOneOffPaymentInput!): OneOffPaymentResponse!
  batchDeleteOneOffPayments(ids: [ID!]!): DeleteResponse!
  createRecurringPayment(input: CreateRecurringPaymentInput!): RecurringPaymentResponse!
  updateRecurringPayment(id: ID!, input: UpdateRecurringPaymentInput!): RecurringPaymentResponse!
  batchDeleteRecurringPayments(ids: [ID!]!): DeleteResponse!
  createNote(input: CreateNoteInput!): NoteResponse!
  updateNote(id: ID!, input: UpdateNoteInput!): NoteResponse!
  deleteNote(id: ID!): DeleteResponse!
  updatePayday(id: ID!, input: PaydayInput!): PaydayResponse!
  setPaydayOverride(id: ID!, for: String!, date: String): PaydayResponse!
  updateReminderSettings(input: UpdateReminderSettingsInput!): BudgetResponse!
  updateReminders(input: UpdateRemindersInput!): ReminderStatesResponse!
  updateCalendarFeed(input: UpdateCalendarFeedInput!): BudgetResponse!
  resetCalendarFeed(budgetId: ID!): BudgetResponse!
}

type Budget {
  id: ID!
  user: User
  bankBalance: Float!
  monthlyIncome: Float!
  oneOffPayments: [OneOffPayment]
  recurringPayments: [RecurringPayment]
  notes: [Note]
  payday: Payday
  cycleStartedOn: String
  reminderSettings: ReminderSettings!
  reminderStates: [ReminderState!]!
  calendarFeed: CalendarFeed!
}

input CreateBudgetInput {
  bankBalance: Float!
  monthlyIncome: Float!
  oneOffPayments: [OneOffPaymentInput!]
  recurringPayments: [RecurringPaymentInput!]
  payday: PaydayInput
}

input UpdateBudgetInput {
  bankBalance: Float
  monthlyIncome: Float
}

input MarkPaymentsPaidInput {
  budgetId: ID!
  recurringPaymentIds: [ID!]!
  oneOffPaymentIds: [ID!]!
}

input MarkPaymentsUnpaidInput {
  budgetId: ID!
  recurringPaymentIds: [ID!]!
  oneOffPaymentIds: [ID!]
}

input UndoDebtOverpaymentInput {
  budgetId: ID!
  recordId: ID!
}

input SkipRecurringPaymentsInput {
  budgetId: ID!
  recurringPaymentIds: [ID!]!
  until: String
}

input LogDebtOverpaymentInput {
  budgetId: ID!
  recurringPaymentId: ID!
  amount: Float!
}

input StartPaydayCycleInput {
  budgetId: ID!
  payday: String!
  bankBalance: Float!
  recurringPaymentIds: [ID!]!
}

type BudgetResponse {
  budget: Budget
  success: Boolean!
}

