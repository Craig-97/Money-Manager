# Takes back an overpayment from this cycle, putting it back on the debt and the bank balance
mutation UndoDebtOverpayment($input: UndoDebtOverpaymentInput!) {
  undoDebtOverpayment(input: $input) {
    budget {
      id
      bankBalance
      accounts {
        ...AccountFields
      }
      recurringPayments {
        ...RecurringPaymentFields
      }
    }
  }
}
