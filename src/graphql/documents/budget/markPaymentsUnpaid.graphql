# Undoes the latest pay or skip this cycle on recurring payments, and makes paid one-offs unpaid,
# putting back exactly what paying did to the balance and any debt
mutation MarkPaymentsUnpaid($input: MarkPaymentsUnpaidInput!) {
  markPaymentsUnpaid(input: $input) {
    budget {
      id
      bankBalance
      accounts {
        ...AccountFields
      }
      recurringPayments {
        ...RecurringPaymentFields
      }
      oneOffPayments {
        ...OneOffPaymentFields
      }
    }
  }
}
