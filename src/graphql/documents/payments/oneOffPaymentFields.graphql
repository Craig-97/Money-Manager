fragment OneOffPaymentFields on OneOffPayment {
  id
  name
  amount
  dueDate
  type
  category
  paidAt
  # The account it goes out of or into; null for the one pay lands in
  account
  # A logo shown in place of its letter; null shows the letter
  iconUrl
  # When its reminder goes off; days left out follow the usual timing
  dueReminder {
    off
    days
  }
}
