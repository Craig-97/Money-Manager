fragment RecurringPaymentFields on RecurringPayment {
  id
  name
  amount
  category
  frequency
  type
  firstPaymentDate
  lastPaymentDate
  nextDueDate
  renewalDate
  renewalReminderDays
  # Its pays and skips this cycle, oldest first
  thisCycle {
    id
    kind
    dates
    balanceChange
    # What a payment took off a debt, for how much has been paid off since payday
    debt {
      reduction
    }
  }
  debt {
    balance
    startingBalance
    apr
    balanceUpdatedAt
  }
}
