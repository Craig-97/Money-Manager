fragment RecurringPaymentFields on RecurringPayment {
  id
  name
  amount
  category
  frequency
  type
  firstPaymentDate
  lastPaymentDate
  nextDueDate
  renewalDate
  # When its reminders go off; days left out follow the usual timing
  dueReminder {
    off
    days
  }
  renewalReminder {
    off
    days
  }
  # Its pays and skips this cycle, oldest first
  thisCycle {
    id
    kind
    dates
    balanceChange
  }
  # The account it goes out of or into; null for the one pay lands in
  account
  # Another account it moves money into, like a standing order
  paysInto
  debt {
    balance
    startingBalance
    apr
    balanceUpdatedAt
    paidOffThisCycle
  }
}
