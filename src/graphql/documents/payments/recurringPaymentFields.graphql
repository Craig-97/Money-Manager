fragment RecurringPaymentFields on RecurringPayment {
  id
  name
  amount
  category
  frequency
  type
  firstPaymentDate
  lastPaymentDate
  nextDueDate
  renewalDate
  renewalReminderDays
  # Its pays and skips this cycle, oldest first
  thisCycle {
    id
    kind
    dates
    balanceChange
  }
  debt {
    balance
    startingBalance
    apr
    balanceUpdatedAt
    paidOffThisCycle
  }
}
