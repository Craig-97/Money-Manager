# Everything that's happened to a debt, newest first: pays, skips, overpayments and balances set
query DebtHistory($id: ID!) {
  recurringPayment(id: $id) {
    id
    history(limit: 50) {
      id
      kind
      dates
      balanceChange
      open
      createdAt
      debt {
        interest
        reduction
        balanceAfter
      }
    }
  }
}
