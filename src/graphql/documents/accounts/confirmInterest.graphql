# A savings account's interest payment, checked: added to the balance, which is dated now. Without
# an amount there was none this time. It moves on to the next payment either way.
mutation ConfirmInterest($input: ConfirmInterestInput!) {
  confirmInterest(input: $input) {
    account {
      ...AccountFields
    }
    budget {
      id
      bankBalance
      accounts {
        ...AccountFields
      }
    }
  }
}
