# Everything the signed-in pages show. Payments and notes are separate entities in the cache,
# so a mutation that returns one updates every page that shows it.
fragment AccountFields on Account {
  id
  bankBalance
  monthlyIncome
  cycleStartedOn
  payday {
    ...PaydayFields
  }
  recurringPayments {
    ...RecurringPaymentFields
  }
  oneOffPayments {
    ...OneOffPaymentFields
  }
  notes {
    ...NoteFields
  }
}
