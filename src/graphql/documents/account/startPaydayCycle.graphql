# Payday: sets the confirmed balance, moves the chosen recurring payments on to their next date,
# closes the last cycle's records and clears away paid one-offs
mutation StartPaydayCycle($input: StartPaydayCycleInput!) {
  startPaydayCycle(input: $input) {
    account {
      id
      bankBalance
      cycleStartedOn
      recurringPayments {
        ...RecurringPaymentFields
      }
      oneOffPayments {
        ...OneOffPaymentFields
      }
    }
  }
}
