<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1013" />
    <meta
      name="description"
      content="Track your balance, regular payments and payday in one place." />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Money Manager</title>
    <!-- Applies the saved theme and accent before the app loads, so the page never flashes the wrong one -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('mm-prefs') || 'null');
          var prefs = (saved && saved.state) || {};
          var theme =
            prefs.theme === 'system'
              ? matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : prefs.theme === 'light'
                ? 'light'
                : 'dark';
          var accent = /^#[0-9a-f]{6}$/i.test(prefs.accent || '') ? prefs.accent : '#7C3AED';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.setProperty('--accent', accent);
          if (accent.toUpperCase() === '#3D6BF5') root.dataset.accent = 'blue';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#EEF0F3' : '#0E1013');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
